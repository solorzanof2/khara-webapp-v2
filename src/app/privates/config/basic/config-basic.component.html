
<section id="config-basic">
  <div class="container">
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
        <app-simple-card
          headerText="Datos Básicos"
        >
          <form
            autocomplete="off"
          >
            <div class="container">
              <div class="sc-row">
                <label for="nameInput" class="row-label">
                  <div class="label-text">
                    <span>Nombres</span>
                  </div>
                  <div class="label-hinttext">Ingresa tus nombres</div>
                </label>
                <div class="row-column">
                  <div class="column-container">
                    <div class="control-wrapper">
                      <input type="text" id="nameInput" class="form-control">
                    </div>
                  </div>
                </div>
              </div>
              <div class="sc-row">
                <label for="lastnameInput" class="row-label">
                  <div class="label-text">
                    <span>Apellidos</span>
                  </div>
                  <div class="label-hinttext">Ingresá tus apellidos</div>
                </label>
                <div class="row-column">
                  <div class="column-container">
                    <div class="control-wrapper">
                      <input type="text" id="lastnameInput" class="form-control">
                    </div>
                  </div>
                </div>
              </div>
              <div class="sc-row">
                <label for="emailInput" class="row-label">
                  <div class="label-text">
                    <span>Email</span>
                  </div>
                  <div class="label-hinttext">Ingresá tu email</div>
                </label>
                <div class="row-column">
                  <div class="column-container">
                    <div class="control-wrapper">
                      <input type="email" id="emailInput" class="form-control">
                    </div>
                  </div>
                </div>
              </div>
              <div class="sc-row">
                <label for="phoneInput" class="row-label">
                  <div class="label-text">
                    <span>Teléfono</span>
                  </div>
                  <div class="label-hinttext">Ingresá tu teléfono: 3431112233</div>
                </label>
                <div class="row-column">
                  <div class="column-container">
                    <div class="control-wrapper">
                      <input type="tel" id="phoneInput" class="form-control">
                    </div>
                  </div>
                </div>
              </div>
              <div class="sc-row">
                <label for="fullAddressInput" class="row-label">
                  <div class="label-text">
                    <span>Calle</span>
                  </div>
                  <div class="label-hinttext">Ingresá tu calle de residencia</div>
                </label>
                <div class="row-column">
                  <div class="column-container">
                    <div class="control-wrapper">
                      <input type="text" id="fullAddressInput" class="form-control">
                    </div>
                  </div>
                </div>
              </div>
              <div class="sc-row">
                <label for="localityInput" class="row-label">
                  <div class="label-text">
                    <span>Barrio</span>
                  </div>
                  <div class="label-hinttext">Ingresá tu barrio de residencia</div>
                </label>
                <div class="row-column">
                  <div class="column-container">
                    <div class="control-wrapper">
                      <input type="text" id="localityInput" class="form-control">
                    </div>
                  </div>
                </div>
              </div>
              <div class="sc-row">
                <label for="postalCodeInput" class="row-label">
                  <div class="label-text">
                    <span>Código Postal</span>
                  </div>
                  <div class="label-hinttext">Ingresá tu código postal</div>
                </label>
                <div class="row-column">
                  <div class="column-container">
                    <div class="control-wrapper">
                      <input type="text" id="postalCodeInput" class="form-control">
                    </div>
                  </div>
                </div>
              </div>
              <div class="sc-row">
                <label for="provinceInput" class="row-label">
                  <div class="label-text">
                    <span>Provincia</span>
                  </div>
                  <div class="label-hinttext">Ingresá tu Provincia</div>
                </label>
                <div class="row-column">
                  <div class="column-container">
                    <div class="control-wrapper">
                      <input type="text" id="provinceInput" class="form-control">
                    </div>
                  </div>
                </div>
              </div>
              <div class="sc-row">
                <label for="documentInput" class="row-label">
                  <div class="label-text">
                    <span>CUIT/CUIL</span>
                  </div>
                  <div class="label-hinttext">Ingresá tu CUIT ó CUIL</div>
                </label>
                <div class="row-column">
                  <div class="column-container">
                    <div class="control-wrapper">
                      <input type="text" id="documentInput" class="form-control">
                    </div>
                  </div>
                </div>
              </div>
              <div class="sc-row">
                <label for="birthdateInput" class="row-label">
                  <div class="label-text">
                    <span>Fecha de Nacimiento</span>
                  </div>
                  <div class="label-hinttext">Ingresá tu fecha de nacimiento</div>
                </label>
                <div class="row-column">
                  <div class="column-container">
                    <div class="control-wrapper">
                      <input type="date" id="birthdateInput" class="form-control">
                    </div>
                  </div>
                </div>
              </div>
              <div class="sc-row">
                <label for="birthdateInput" class="row-label">
                  <!-- <div class="label-text">
                    <span>Fecha de Nacimiento</span>
                  </div>
                  <div class="label-hinttext">Ingresá tu fecha de nacimiento</div> -->
                </label>
                <div class="row-column">
                  <div class="column-container">
                    <div class="control-wrapper">
                      <button type="button" class="btn btn-success">Enviar</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </app-simple-card>
      </div>
    </div>
  </div>
</section>
